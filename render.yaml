# Render Blueprint for the PocketLaw Flask API.
# Render dashboard: New -> Blueprint -> select this repository -> Apply.
services:
  - type: web
    name: pocketlaw-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/build_index.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Set to your Vercel URL (e.g. https://pocketlaw.vercel.app) once the frontend is deployed.
      - key: ALLOWED_ORIGINS
        value: "*"
